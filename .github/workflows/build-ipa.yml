name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Decrypted Spotify IPA URL (Dropbox share links accepted)"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]
      remove_plugins:
        description: "Remove every app extension (PlugIns/) from the IPA"
        type: boolean
        default: false
      enable_wireguard:
        description: "Include app-local WireGuard / proxy (inspected Spotify IPA only; off until enabled)"
        type: boolean
        default: true
      enable_pixie:
        description: "Include Pixie native downloads (exact Spotify 9.2.0, 9.2.2 or 9.1.90 build only)"
        type: boolean
        default: true
      bundle_id:
        description: "Bundle ID must match the signing App ID; extension IDs follow it (type com.spotify.client to keep Spotify's ID)"
        default: "app.retrine.player"
        required: false
        type: string
      runner:
        description: "macOS runner (both have Xcode 26.6). A build not given its runner within 30 s starts again on the other one"
        default: macos-latest
        type: choice
        options: [macos-latest, macos-26-intel]
      runner_hops:
        description: "Set by the runner watchdog: how many times this build has moved runner. Leave at 0"
        default: 0
        type: number
      sha:
        description: "Set by the runner watchdog to keep building the original commit. Leave empty"
        default: ""
        type: string

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  # GitHub has no fallback for a runner label that is not acquired: the job waits in the queue (runs 13 to 16 sat
  # there 15 min and were cancelled without a runner). This job watches the build; if it is still queued
  # RUNNER_WAIT_SECONDS after it was created, it dispatches this workflow again with the same inputs on the next
  # runner in FALLBACK and cancels this run (or the replacement if the build just started). The last runner has no watchdog.
  #
  # Only runners with the toolchain every build so far used (Xcode 26.6, iOS 26.5 SDK) are in FALLBACK, each its own
  # pool, so a starved pool is left rather than queued on again (runner-images, November 2026):
  #   macos-latest   = macOS 26 arm64, Xcode 26.6
  #   macos-26-intel = macOS 26 x64,   Xcode 26.6
  # Left out: macos-26 (the same pool as macos-latest), macOS 15 (newest Xcode 26.3, an older iOS SDK the code was
  # never built against) and macOS 14 (no Xcode 26, retired). The two take turns up to MAX_HOPS moves, then the
  # build waits where it is. 30 s: a healthy pool hands a macOS runner over in about 5 s (runs 1 to 35).
  runner-watchdog:
    if: inputs.runner_hops < 5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      # GitHub prints a step's env before the step runs, so mask the inputs first (run 36 showed the IPA URL).
      - uses: levibostian/action-hide-sensitive-inputs@39cfbde19b3251728d2357dd0648172d1202c1ee # v1

      - name: Move a build that got no runner to the next macOS version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          BUILD_SHA: ${{ inputs.sha || github.sha }}
          RUNNER_WAIT_SECONDS: "30"
          FALLBACK: "macos-latest=macos-26-intel macos-26-intel=macos-latest"
          MAX_HOPS: "5"
          HOPS: ${{ inputs.runner_hops || 0 }}
          CURRENT_RUNNER: ${{ inputs.runner || 'macos-latest' }}
          IN_IPA_URL: ${{ inputs.ipa_url }}
          IN_UPLOAD_METHOD: ${{ inputs.upload_method }}
          IN_REMOVE_PLUGINS: ${{ inputs.remove_plugins }}
          IN_ENABLE_WIREGUARD: ${{ inputs.enable_wireguard }}
          IN_ENABLE_PIXIE: ${{ inputs.enable_pixie }}
          IN_BUNDLE_ID: ${{ inputs.bundle_id }}
        shell: bash
        run: |
          # The IPA URL can carry a private share token.
          echo "::add-mask::$IN_IPA_URL"
          python3 -B - <<'PY'
          import json
          import os
          import subprocess
          import time
          from datetime import datetime, timezone

          repo, run_id = os.environ["GH_REPO"], os.environ["RUN_ID"]
          wait = float(os.environ["RUNNER_WAIT_SECONDS"])
          current = os.environ["CURRENT_RUNNER"]
          fallback = dict(pair.split("=", 1) for pair in os.environ["FALLBACK"].split())
          after = fallback.get(current)
          hops = int(float(os.environ["HOPS"] or 0))
          if not after or hops >= int(os.environ["MAX_HOPS"]):
              print(f"no further runner after {current} (moves so far: {hops}); the build waits where it is")
              raise SystemExit(0)

          def build_job():
              out = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"], text=True)
              return next((j for j in json.loads(out)["jobs"] if j["name"] == "build"), None)

          def created(job):
              return datetime.fromisoformat(job["created_at"].replace("Z", "+00:00"))

          job = None
          for _ in range(60):
              job = build_job()
              if job:
                  break
              time.sleep(1)
          if not job:
              print("the build job was not found; leaving the run as it is")
              raise SystemExit(0)
          while True:
              if job["status"] != "queued":
                  print(f"build got a runner ({job.get('runner_name') or job['status']}) on {current}")
                  raise SystemExit(0)
              elapsed = (datetime.now(timezone.utc) - created(job)).total_seconds()
              if elapsed >= wait:
                  break
              time.sleep(max(1.0, min(10.0, wait - elapsed)))
              job = build_job()

          inputs = {
              "ipa_url": os.environ["IN_IPA_URL"],
              "upload_method": os.environ["IN_UPLOAD_METHOD"] or "artifacts",
              "remove_plugins": os.environ["IN_REMOVE_PLUGINS"] or "false",
              "enable_wireguard": os.environ["IN_ENABLE_WIREGUARD"] or "true",
              "enable_pixie": os.environ["IN_ENABLE_PIXIE"] or "true",
              "bundle_id": os.environ["IN_BUNDLE_ID"],
              "runner": after,
              "runner_hops": str(hops + 1),
              "sha": os.environ["BUILD_SHA"],
          }
          payload = {"ref": os.environ["REF"], "inputs": inputs, "return_run_details": True}
          job = build_job()
          if not job or job["status"] != "queued":
              print("build is no longer queued; leaving this run alone")
              raise SystemExit(0)
          print(f"::warning::build waited {elapsed:.0f} s for {current} without a runner; starting again on {after}")
          response = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/actions/workflows/build-ipa.yml/dispatches", "--input", "-",
               "-H", "X-GitHub-Api-Version: 2022-11-28"], input=json.dumps(payload), text=True)
          replacement_id = str(json.loads(response)["workflow_run_id"])
          # Dispatched first: cancelling this run also stops this job.
          job = build_job()
          cancel_id = run_id if job and job["status"] == "queued" else replacement_id
          subprocess.run(["gh", "run", "cancel", cancel_id], check=True)
          PY

  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: levibostian/action-hide-sensitive-inputs@39cfbde19b3251728d2357dd0648172d1202c1ee # v1

      - uses: ./.github/actions/setup-theos
        with:
          brew: aria2

      # Never build against an iOS SDK older than the one the code is known to build with (Xcode 26.6's): if an
      # image ever ships an older newest Xcode, this stops here and says so instead of failing on a missing API.
      - name: Check the iOS SDK
        env:
          MIN_IOS_SDK: "26.5"
        run: |
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "runner ${{ inputs.runner || 'macos-latest' }} ($(uname -m)), $(xcodebuild -version | head -1), iOS SDK $sdk"
          if [ "$(printf '%s\n%s\n' "$MIN_IOS_SDK" "$sdk" | sort -V | head -1)" != "$MIN_IOS_SDK" ]; then
            echo "::error::this runner's newest Xcode has the iOS $sdk SDK; Retrine is built against iOS $MIN_IOS_SDK or newer. Pick another runner."
            exit 1
          fi

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        if: inputs.enable_wireguard
        with:
          go-version-file: WireGuard/go.mod
          cache-dependency-path: WireGuard/go.sum

      - name: Verify pinned Go release
        if: inputs.enable_wireguard
        env:
          GOTOOLCHAIN: local
        run: test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' WireGuard/go.mod)"

      - name: Install cyan
        run: python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p ipa
          IPA_URL="$(python3 -B - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          url = os.environ["IPA_URL"].strip().replace(r"\&", "&")
          parts = urlsplit(url)
          if parts.scheme == "https" and parts.hostname in {"dropbox.com", "www.dropbox.com", "dl.dropboxusercontent.com"}:
              query = [(k, v) for k, v in parse_qsl(parts.query, keep_blank_values=True) if k != "dl"]
              query.append(("dl", "1"))
              url = urlunsplit(parts._replace(netloc="dl.dropboxusercontent.com", query=urlencode(query)))
          print(url)
          PY
          )"
          # Mask the normalized URL too; it can contain a private share token.
          echo "::add-mask::$IPA_URL"
          # Many file hosts throttle each connection and drop long transfers, so fetch in
          # parallel ranges and resume on failure (one connection when ranges aren't served).
          aria2c --console-log-level=error --summary-interval=0 --download-result=hide \
            --max-connection-per-server=8 --split=8 --min-split-size=1M \
            --max-tries=20 --retry-wait=3 --continue=true --allow-overwrite=true \
            --dir=ipa --out=spotify.ipa "$IPA_URL" || {
            echo "::warning::the parallel download failed, fetching on one connection"
            rm -f ipa/spotify.ipa ipa/spotify.ipa.aria2
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 3 -C - -o ipa/spotify.ipa "$IPA_URL"
          }

      - name: Validate Spotify IPA
        id: spotify
        run: python3 -B scripts/validate-ipa.py ipa/spotify.ipa --github-output "$GITHUB_OUTPUT"

      # pipeline.sh reads the flag table out of the IPA (over a minute) only when the one it finds is
      # for another Spotify version, and rebuilds the Live Activity extension only when its inputs changed.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: tweak/Sources/Shared/Flags/SGFlagList.m
          key: flags-${{ steps.spotify.outputs.version }}-${{ hashFiles('scripts/extract-flags.py') }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: out/extension
          key: extension-${{ steps.spotify.outputs.version }}-${{ hashFiles('extension/LiveActivity/**', 'extension/OpenInRetrine/**', 'tweak/Sources/Shared/LiveActivity/**', 'tweak/Sources/Shared/Navigation/LinkURL.*', 'scripts/build-extension.sh') }}

      - name: Build IPA
        env:
          # A cleared field is the default again, never Spotify's ID: a free Apple ID registers the
          # ID it signs under with Apple, so Spotify's has to be asked for by name.
          BUNDLE_ID: ${{ inputs.bundle_id || 'app.retrine.player' }}
          WIREGUARD: ${{ inputs.enable_wireguard && '1' || '0' }}
          PIXIE: ${{ inputs.enable_pixie && '1' || '0' }}
          MAKEFLAGS: -k
        run: |
          set -o pipefail
          # The pipeline keeps Spotify's ID when it is given none.
          if [[ "$BUNDLE_ID" == "com.spotify.client" ]]; then export BUNDLE_ID=; fi
          if make release IPA=ipa/spotify.ipa NO_PLUGINS=${{ inputs.remove_plugins && '1' || '0' }} 2>&1 | tee "$RUNNER_TEMP/ipa-build.log"; then
            exit 0
          else
            status=$?
          fi
          python3 -B - "$RUNNER_TEMP/ipa-build.log" <<'PY'
          import pathlib
          import re
          import sys
          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          with open(sys.argv[1], errors="replace") as log:
              for line in log:
                  line = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", line).rstrip()
                  match = re.match(r"^(.*?):(\d+):(?:(\d+):)?\s*(?:fatal )?error:\s*(.*)", line)
                  if match:
                      path, row, column, message = match.groups()
                      if not pathlib.Path(path).is_absolute() and not pathlib.Path(path).is_file():
                          path = str(pathlib.Path("tweak") / path)
                      path = escape(path).replace(",", "%2C").replace(":", "%3A")
                      print(f"::error file={path},line={row}::{escape(message)}")
                  elif re.search(r"error:|Error \d+", line):
                      print(f"::error::{escape(line)}")
          PY
          exit "$status"

      - name: Verify app extensions removed
        if: inputs.remove_plugins
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import zipfile
          for ipa in Path("out").glob("*.ipa"):
              with zipfile.ZipFile(ipa) as archive:
                  if any(part == "PlugIns" or part.endswith(".appex")
                         for name in archive.namelist() for part in name.split("/")):
                      raise SystemExit(f"{ipa} still contains an app extension")
              print(f"{ipa}: no app extensions")
          PY

      - run: ccache --show-stats

      # The artifact service is sometimes out of reach for a moment (run 35: "Failed to CreateArtifact: Unable to
      # make request: ENOTFOUND" after a good build), so a failed upload is tried once more instead of losing the IPA.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: upload
        if: inputs.upload_method != 'filebin'
        continue-on-error: true
        with:
          name: retrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Wait before uploading again
        if: steps.upload.outcome == 'failure'
        run: sleep 30

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.upload.outcome == 'failure'
        with:
          name: retrine.ipa
          path: out/*.ipa
          if-no-files-found: error
          overwrite: true

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="retrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
