name: Mac harnesses

on:
  push:
    branches: [main, ci/harness]
    paths: ['tweak/**', 'harness/**', 'vendor/**', 'scripts/harness-plan.py', 'scripts/test_harness_plan.py', '.github/**']
  pull_request:
    paths: ['tweak/**', 'harness/**', 'vendor/**', 'scripts/harness-plan.py', 'scripts/test_harness_plan.py', '.github/**']

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check harness selection
        run: python3 -B -m unittest discover -s scripts -p test_harness_plan.py
      - name: Select harnesses
        if: github.event_name == 'pull_request'
        id: plan
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
        run: |
          changed=$(mktemp)
          if HARNESS_PLAN_BASE=$(git merge-base "origin/$BASE_REF" "$SHA") &&
             git diff --no-renames --name-only "$HARNESS_PLAN_BASE" "$SHA" > "$changed"; then
            export HARNESS_PLAN_BASE
            python3 scripts/harness-plan.py plan --changed-from "$changed" --github-output "$GITHUB_OUTPUT"
          else
            echo "pull request diff failed; running everything" >&2
            python3 scripts/harness-plan.py plan --all --github-output "$GITHUB_OUTPUT"
          fi

  harness:
    name: Harnesses ${{ matrix.shard }}
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.any == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Theos for Logos hooks only
        if: matrix.theos
        uses: ./.github/actions/setup-theos
      - name: Build and assert
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
          SHARD: ${{ matrix.shard }}
          NAMES: ${{ matrix.harnesses }}
        run: python3 scripts/harness-plan.py run --shard "$SHARD" --names "$NAMES"
