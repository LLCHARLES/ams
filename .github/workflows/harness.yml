name: Mac harnesses

on:
  push:
    branches: [main, ci/harness]
    paths: ['tweak/**', 'harness/**', 'vendor/**', 'scripts/harness-plan.py', 'scripts/test_harness_plan.py', '.github/**']
  pull_request:
    paths: ['tweak/**', 'harness/**', 'vendor/**', 'scripts/harness-plan.py', 'scripts/test_harness_plan.py', '.github/**']

permissions:
  contents: read

concurrency:
  # The freshness check and rerun POST aren't atomic. A retry must never evict a newer
  # pending or running first attempt, even if a push lands between those two requests.
  group: harness-${{ github.workflow }}-${{ github.ref }}-${{ github.run_attempt == '1' && 'latest' || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check harness selection
        run: python3 -B -m unittest discover -s scripts -p test_harness_plan.py
      - name: Select harnesses
        if: github.event_name == 'pull_request'
        id: plan
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
        run: |
          changed=$(mktemp)
          if HARNESS_PLAN_BASE=$(git merge-base "origin/$BASE_REF" "$SHA") &&
             git diff --no-renames --name-only "$HARNESS_PLAN_BASE" "$SHA" > "$changed"; then
            export HARNESS_PLAN_BASE
            python3 scripts/harness-plan.py plan --changed-from "$changed" --github-output "$GITHUB_OUTPUT"
          else
            echo "pull request diff failed; running everything" >&2
            python3 scripts/harness-plan.py plan --all --github-output "$GITHUB_OUTPUT"
          fi

  runner-watchdog:
    name: Runner watchdog
    needs: plan
    if: >-
      always() && needs.plan.result == 'success' &&
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && fromJSON(github.run_attempt) < 4 && needs.plan.outputs.any == 'true'
    permissions:
      actions: write
    uses: ./.github/workflows/runner-queue-watchdog.yml
    with:
      shards: ${{ join(fromJSON(needs.plan.outputs.matrix).include.*.shard, ',') }}

  harness:
    name: Harnesses ${{ matrix.shard }}
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.any == 'true'
    runs-on: >-
      ${{ (endsWith(github.run_attempt, '0') || endsWith(github.run_attempt, '2') || endsWith(github.run_attempt, '4') ||
           endsWith(github.run_attempt, '6') || endsWith(github.run_attempt, '8')) && 'macos-26-intel' || 'macos-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Theos for Logos hooks only
        if: matrix.theos
        uses: ./.github/actions/setup-theos
      - name: Install ffmpeg and Pillow for the header pixel check
        if: contains(matrix.harnesses, 'Header decoder suspension')
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          /usr/bin/python3 -m venv "$RUNNER_TEMP/header-pixels"
          "$RUNNER_TEMP/header-pixels/bin/python" -m pip install --only-binary=:all: Pillow==11.3.0
          echo "MOTION_PIXELS_PYTHON=$RUNNER_TEMP/header-pixels/bin/python" >> "$GITHUB_ENV"
      - name: Build and assert
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
          SHARD: ${{ matrix.shard }}
          NAMES: ${{ matrix.harnesses }}
        run: python3 scripts/harness-plan.py run --shard "$SHARD" --names "$NAMES"
