name: Build .deb + dylib

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Optional: a decrypted Spotify IPA. Only to read the remote-config flags from — the tweak links SGFlagList.m, which scripts/extract-flags.py generates out of an IPA. Without it the flags table is built empty."
        required: false
        default: ""
        type: string
      schemes:
        description: "Which jailbreak layouts to package for. All three carry the same dylib; only where it is installed and the package's architecture differ."
        default: all
        type: choice
        options: [all, rootful, rootless, roothide]
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]
  push:
    branches: [michaelmelita1, ams]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Generate the flags table
        # SGFlagList.m is gitignored and generated from an IPA (scripts/extract-flags.py); the link fails
        # without it. With an IPA the real table is read out of it; without one it is built empty, which
        # leaves the flags pages listing nothing and changes nothing else.
        run: |
          if [ -n "${{ inputs.ipa_url }}" ]; then
            mkdir -p ipa
            curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
            python3 scripts/extract-flags.py ipa/spotify.ipa
          else
            echo "no ipa_url: building with an empty flags table"
            printf '#import "Flags.h"\nconst SGFlagDef SGFlagTable[] = {{0}};\nconst NSUInteger SGFlagCount = 0;\n' \
              > tweak/Sources/Shared/Flags/SGFlagList.m
          fi
          wc -l tweak/Sources/Shared/Flags/SGFlagList.m

      - name: Build the dylib
        run: |
          env -u MAKELEVEL gmake -C tweak SG_DRIVER=0
          mkdir -p out
          cp tweak/.theos/obj/spotifyglass.dylib out/spotifyglass.dylib
          # The copy in .theos/obj is unsigned: Theos signs the one it puts in the .deb, not this one, and
          # a modern jailbreak refuses an unsigned dylib, which is what made the uploaded one unusable.
          ldid -S out/spotifyglass.dylib
          file out/spotifyglass.dylib
          lipo -archs out/spotifyglass.dylib

      - name: Package
        # Same dylib, two layouts: rootful under /Library/MobileSubstrate, rootless under the jailbreak's
        # own prefix (/var/jb). Rootful is the default — Theos has no scheme by that name, it is what
        # packaging does with none set — and it has to say iphoneos-arm; rootless says iphoneos-arm64, or
        # dpkg refuses the package on those devices. (RootHide needs Theos from the RootHide fork.)
        run: |
          case "${{ inputs.schemes }}" in
            rootful|rootless) LIST="${{ inputs.schemes }}" ;;
            *) LIST="rootful rootless" ;;
          esac
          cp tweak/control /tmp/control.orig
          for SCHEME in $LIST; do
            cp /tmp/control.orig tweak/control
            if [ "$SCHEME" = rootful ]; then ARCH=iphoneos-arm; SCHEME_OPT=""; else ARCH=iphoneos-arm64; SCHEME_OPT="THEOS_PACKAGE_SCHEME=$SCHEME"; fi
            sed -i '' "s/^Architecture:.*/Architecture: $ARCH/" tweak/control
            if env -u MAKELEVEL gmake -C tweak package FINALPACKAGE=1 SG_DRIVER=0 \
                 $SCHEME_OPT >"/tmp/pkg-$SCHEME.log" 2>&1; then
              DEB="$(ls -t tweak/packages/*.deb | head -n 1)"
              cp "$DEB" "out/vitrine-$SCHEME.deb"
              echo "packaged $SCHEME"
            else
              echo "::warning::$SCHEME could not be packaged; skipping it"
              tail -n 12 "/tmp/pkg-$SCHEME.log"
            fi
          done
          cp /tmp/control.orig tweak/control
          ls -la out

      - name: Validate
        run: |
          ls out/*.deb >/dev/null 2>&1 || { echo "::error::No .deb produced"; exit 1; }
          for DEB in out/*.deb; do
            echo "--- $DEB ---"
            dpkg-deb --info "$DEB" | sed -n '1,12p'
            dpkg-deb --contents "$DEB" | grep -E "dylib|plist" || true
          done
          echo "--- the dylib on its own ---"
          file out/spotifyglass.dylib
          {
            echo "### What to install"
            echo ""
            echo "- **rootful** (checkra1n, unc0ver): \`vitrine-rootful.deb\` — \`/Library/MobileSubstrate\`"
            echo "- **rootless** (Dopamine, palera1n, Xina): \`vitrine-rootless.deb\` — under the jailbreak's prefix"
            echo "- **roothide**: \`vitrine-roothide.deb\`"
            echo ""
            echo "The bare \`spotifyglass.dylib\` is signed with ldid and is the one to inject into an IPA."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: ${{ github.event_name == 'push' || inputs.upload_method != 'filebin' }}
        with:
          name: vitrine-deb-dylib
          path: |
            out/*.deb
            out/spotifyglass.dylib
          if-no-files-found: error

      - name: Upload to filebin.net
        if: ${{ github.event_name != 'push' && inputs.upload_method != 'artifacts' }}
        run: |
          BIN="vitrine-deb-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.deb out/spotifyglass.dylib; do
            [ -f "$f" ] || continue
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
