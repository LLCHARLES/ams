name: Build IPA (Metal visualiser)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build from (the run checks out this, not the default branch)"
        default: "metal-visualiser"
        type: string
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        default: "https://www.dropbox.com/scl/fi/dketx2qfh1vjerhmatoi2/Spotify9.1.78.ipa?rlkey=2qq2sl9tmey87jiwfnfw7nxoz&st=4dlj8htm&dl=1"
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      # workflow_dispatch does not move HEAD: without an explicit ref, checkout takes the
      # repository's default branch, so a run dispatched on a feature branch builds that
      # branch's workflow file against main's sources. This is the branch the run was asked for.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Say which sources this run got
        run: |
          echo "checked out: $(git rev-parse --abbrev-ref HEAD)  $(git rev-parse --short HEAD)"
          echo "MetalVisualiser present: $(test -d tweak/Sources/Redesigned/MetalVisualiser && echo yes || echo no)"
          test -d tweak/Sources/Redesigned/MetalVisualiser || { echo "::error::wrong sources checked out"; exit 1; }

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fL --retry 3 --retry-delay 5 "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          # Dropbox serves a landing page when the link asks for it; make sure we got an IPA and
          # not a few bytes of HTML, which would otherwise fail much later in the pipeline.
          case "$(file --mime-type -b ipa/spotify.ipa)" in
            application/zip|application/x-ios-app|application/octet-stream) ;;
            *) echo "::error::Not an IPA ($(file --mime-type -b ipa/spotify.ipa), $(wc -c < ipa/spotify.ipa) bytes)"; exit 1 ;;
          esac
          if [ "$(wc -c < ipa/spotify.ipa)" -lt 50000000 ]; then
            echo "::error::IPA is only $(wc -c < ipa/spotify.ipa) bytes — that is a landing page, not an IPA"
            exit 1
          fi

      - name: Check the Metal toolchain
        run: |
          set -e
          echo "--- xcrun -sdk iphoneos metal -v ---"
          xcrun -sdk iphoneos metal -v 2>&1 | head -3
          echo "--- a trivial shader, straight to .metallib (as the Makefile does) ---"
          cat > /tmp/probe.metal <<'EOF'
          #include <metal_stdlib>
          using namespace metal;
          vertex float4 probeVertex(uint vid [[vertex_id]]) {
              float2 p[3] = { float2(-1.0, -3.0), float2(-1.0, 1.0), float2(3.0, 1.0) };
              return float4(p[vid], 0.0, 1.0);
          }
          fragment float4 probeFragment() {
              return float4(1.0, 0.0, 0.0, 1.0);
          }
          EOF
          xcrun -sdk iphoneos metal -O3 -o /tmp/probe.metallib /tmp/probe.metal
          ls -la /tmp/probe.metallib
          echo "--- the real shaders ---"
          xcrun -sdk iphoneos metal -O3 -o /tmp/sgr.metallib tweak/Sources/Redesigned/MetalVisualiser/SGRMetalShaders.metal
          ls -la /tmp/sgr.metallib
          echo "Metal toolchain OK"

      - name: Probe the encoder protocols in isolation
        run: |
          # Read the SDK's own declarations instead of guessing at spellings.
          SDK="$(xcrun -sdk iphoneos --show-sdk-path)"
          echo "SDK: $SDK"
          echo "=== setFragmentTexture / setFragmentBytes / setFragmentSamplerState 声明 ==="
          grep -rn "setFragmentTexture\|setFragmentBytes\|setFragmentSamplerState" \
               "$SDK/System/Library/Frameworks/Metal.framework/Headers/" | head -20
          echo
          echo "=== MTLRenderCommandEncoder 协议名列表 ==="
          grep -rno "MTLRenderCommandEncoder[A-Za-z0-9_]*" \
               "$SDK/System/Library/Frameworks/Metal.framework/Headers/MTLRenderCommandEncoder.h" \
               2>/dev/null | sed 's/.*://' | sort -u | head -20
          echo
          echo "=== fillRegion / copyFromBuffer 声明 ==="
          grep -rn "fillRegion\|copyFromBuffer" \
               "$SDK/System/Library/Frameworks/Metal.framework/Headers/" | head -12
          echo
          echo "=== 相关协议头文件 ==="
          ls "$SDK/System/Library/Frameworks/Metal.framework/Headers/" | grep -i "rendercommand\|blitcommand" | head

      - name: Syntax-check the visualiser alone
        run: |
          # Advisory only. It does not have the Theos include paths or the project's -ISources
          # layout, and it reported seventeen phantom "unknown selector" errors on code that the
          # real build compiles. Kept as a fast first look, but a failure here does not stop the
          # build — the tweak's own compiler is the authority.
          cd tweak
          xcrun clang -fsyntax-only -fobjc-arc -x objective-c \
            -isysroot "$(xcrun -sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios16.0 \
            -ISources -ISources/Headers \
            Sources/Redesigned/MetalVisualiser/SGRMetalVisualiser.m > ../syntax.log 2>&1 || true
          echo "advisory syntax check done ($(grep -c 'error:' ../syntax.log || echo 0) error lines); the build below is authoritative"

      - name: Build
        run: |
          set -o pipefail
          make release 2>&1 | tee build.log
          status=$?
          echo "::group::error lines"
          grep -nE "error:|fatal error|No such file|Undefined symbol|undeclared|Assertion" build.log | head -40 || echo "(no error lines found)"
          echo "::endgroup::"
          echo "::group::build log tail"
          tail -80 build.log
          echo "::endgroup::"
          exit $status

      # The job log cannot be fetched from outside a browser session, so the build log rides along
      # as an artifact too: a failure then says what went wrong without opening the run page.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin' && success()
        with:
          name: ams-metal.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="ams-metal-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"