name: Retry runner starvation

on:
  workflow_run:
    workflows: [Mac harnesses, WireGuard checks]
    types: [completed]

permissions:
  actions: write
  checks: read
  pull-requests: read

concurrency:
  group: runner-starvation-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt < 2 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only this default-branch inline code runs: no checkout, artifacts or run logs.
      - name: Retry an attempt ended by runner starvation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json
          import os
          import subprocess
          from urllib.parse import urlencode

          WATCH = "Runner watchdog / Watch queue"

          def decision(run, jobs, annotations):
              if (run["event"] != "pull_request" or not 1 <= run["run_attempt"] < 2
                      or run["conclusion"] not in ("failure", "cancelled")):
                  return False
              # An intentionally skipped watchdog (notably on forks) isn't a workload.
              unsuccessful = [j for j in jobs if j["conclusion"] != "success"
                              and not (j["conclusion"] == "skipped" and j["name"] in
                                       ("Runner watchdog", WATCH))]
              unacquired = {j["id"] for j in unsuccessful
                            if j["conclusion"] in ("failure", "cancelled") and not j["steps"]
                            and any("was not acquired by Runner" in a["message"]
                                    for a in annotations[j["id"]])}
              # GitHub can cancel running siblings when another shard never acquires a runner.
              if (any(j["id"] in unacquired and j["name"] not in ("Runner watchdog", WATCH)
                      for j in unsuccessful)
                      and all(j["id"] in unacquired or j["conclusion"] == "cancelled"
                              for j in unsuccessful)):
                  return True
              if (run["conclusion"] != "cancelled" or
                      (run["head_repository"] or {}).get("full_name") != os.environ["GH_REPO"]):
                  return False
              # Only accept the same-repo watchdog's receipt for these exact, untouched jobs.
              # A marker on a workload, a previous attempt, or beside a real failure is not evidence.
              protected = [j for j in jobs if j["name"].startswith("Harnesses ")
                           or j["name"] == "apple"]
              workloads = [j for j in unsuccessful if j["name"] != WATCH]
              if (not protected or {j["id"] for j in protected} != {j["id"] for j in workloads}
                      or any(j["conclusion"] != "cancelled" or j["runner_id"] or j["steps"] for j in protected)):
                  return False
              receipt = "Retrine runner starvation: cancelled queued jobs " + ",".join(
                  str(i) for i in sorted(j["id"] for j in protected))
              return any(j["name"] == WATCH and j["conclusion"] in ("success", "cancelled")
                         and any(a["annotation_level"] == "warning" and a["message"] == receipt
                                 for a in annotations[j["id"]]) for j in jobs)

          def api(endpoint):
              return json.loads(subprocess.check_output(
                  ["gh", "api", endpoint], text=True))

          def pages(endpoint):
              return json.loads(subprocess.check_output(
                  ["gh", "api", "--paginate", "--slurp", endpoint], text=True))

          def still_latest(base, run):
              repo = run["head_repository"]
              if not repo:
                  return False
              branch = run["head_branch"]
              query = urlencode({"event": "pull_request", "branch": branch, "per_page": 100,
                                 "created": ">=" + run["created_at"]})
              listing = api(f"{base}/actions/workflows/{run['workflow_id']}/runs?{query}")
              runs = listing["workflow_runs"]
              # An incomplete listing cannot prove that this is the latest run.
              if listing["total_count"] != len(runs) or not any(r["id"] == run["id"] for r in runs):
                  return False
              if any(r["run_number"] > run["run_number"] and
                     (not r["head_repository"] or r["head_repository"]["id"] == repo["id"]) for r in runs):
                  return False

              linked = run["pull_requests"]
              if not linked:
                  # Fork workflow runs can omit the PR link. Require one unambiguous open PR.
                  query = urlencode({"state": "open", "head": repo["owner"]["login"] + ":" + branch})
                  linked = api(f"{base}/pulls?{query}")
              if len(linked) != 1:
                  return False
              pr = api(f"{base}/pulls/{linked[0]['number']}")
              head = pr["head"]
              return (pr["state"] == "open" and pr["created_at"] <= run["created_at"]
                      and head["repo"] and head["repo"]["id"] == repo["id"]
                      and head["ref"] == branch and head["sha"] == run["head_sha"])

          def main():
              with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
                  run = json.load(event_file)["workflow_run"]
              attempt = run["run_attempt"]
              base = f"repos/{os.environ['GH_REPO']}"
              endpoint = f"{base}/actions/runs/{run['id']}"
              current = api(endpoint)
              if current["run_attempt"] != attempt or current["status"] != "completed":
                  print("No retry: run has already advanced or is not completed")
                  return
              jobs = [job for page in pages(endpoint + f"/attempts/{attempt}/jobs?per_page=100")
                      for job in page["jobs"]]
              annotations = {}
              for job in jobs:
                  if job["conclusion"] != "success" or job["name"] == WATCH:
                      check_id = int(job["check_run_url"].rsplit("/", 1)[1])
                      annotations[job["id"]] = [
                          annotation
                          for page in pages(f"{base}/check-runs/{check_id}/annotations?per_page=100")
                          for annotation in page]
              if not decision(current, jobs, annotations):
                  print("No retry: not a verified starvation attempt")
                  return
              # A manual retry may have started while annotations were being read.
              current = api(endpoint)
              if current["run_attempt"] != attempt or current["status"] != "completed":
                  print("No retry: run advanced during inspection")
                  return
              if not still_latest(base, current):
                  print("No retry: cannot confirm the latest run and current open PR head")
                  return
              subprocess.run(["gh", "run", "rerun", str(run["id"])], check=True)

          if __name__ == "__main__":
              main()
          PY
