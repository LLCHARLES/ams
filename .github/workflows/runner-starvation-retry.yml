name: Retry runner starvation

on:
  workflow_run:
    workflows: [Mac harnesses, WireGuard checks]
    types: [completed]

permissions:
  actions: write
  checks: read

concurrency:
  group: runner-starvation-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    # Most completions are successes or later attempts; skip them without starting a runner.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only this default-branch inline code runs: no checkout, artifacts or run logs.
      - name: Retry only an entirely unacquired first attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json
          import os
          import subprocess

          def decision(run, jobs, annotations):
              if run["run_attempt"] != 1:
                  return False, "attempt is not 1"
              if run["conclusion"] not in ("failure", "cancelled"):
                  return False, "run did not fail or cancel"
              unsuccessful = [j for j in jobs if j["conclusion"] != "success"]
              if not unsuccessful:
                  return False, "no unsuccessful jobs"
              for job in unsuccessful:
                  if job["steps"]:
                      return False, f"job {job['id']} has steps"
                  if not any("was not acquired by Runner" in a["message"]
                             for a in annotations[str(job["id"])]):
                      return False, f"job {job['id']} lacks the starvation annotation"
              return True, "every unsuccessful job was unacquired with no steps"

          def api(endpoint):
              return json.loads(subprocess.check_output(
                  ["gh", "api", endpoint], text=True))

          def pages(endpoint):
              return json.loads(subprocess.check_output(
                  ["gh", "api", "--paginate", "--slurp", endpoint], text=True))

          def main():
              with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
                  run = json.load(event_file)["workflow_run"]
              if run["run_attempt"] != 1 or run["conclusion"] not in ("failure", "cancelled"):
                  print("No retry:", decision(run, [], {})[1])
                  return
              base = f"repos/{os.environ['GH_REPO']}"
              endpoint = f"{base}/actions/runs/{run['id']}"
              current = api(endpoint)
              if current["run_attempt"] != 1 or current["status"] != "completed":
                  print("No retry: run has already advanced or is not completed")
                  return
              jobs = [job for page in pages(endpoint + "/attempts/1/jobs?per_page=100")
                      for job in page["jobs"]]
              annotations = {}
              for job in jobs:
                  if job["conclusion"] != "success":
                      check_id = int(job["check_run_url"].rsplit("/", 1)[1])
                      annotations[str(job["id"])] = [
                          annotation
                          for page in pages(f"{base}/check-runs/{check_id}/annotations?per_page=100")
                          for annotation in page]
              retry, reason = decision(current, jobs, annotations)
              print("Retry:" if retry else "No retry:", reason)
              if not retry:
                  return
              # A manual retry may have started while annotations were being read.
              current = api(endpoint)
              if current["run_attempt"] != 1 or current["status"] != "completed":
                  print("No retry: run advanced during inspection")
                  return
              subprocess.run(["gh", "run", "rerun", str(run["id"]), "--failed"], check=True)

          if __name__ == "__main__":
              main()
          PY
