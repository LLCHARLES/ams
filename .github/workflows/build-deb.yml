# A manual deb build for a branch, what release.yml's build job does without the release-please
# side effects. The flag table comes from the SG_FLAG_LIST secret; without it an empty table
# builds (Labs and All flags are empty, everything else is unchanged).
name: Build deb

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      - name: Flag table
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          if [ -n "$SG_FLAG_LIST" ]; then
            echo "$SG_FLAG_LIST" | base64 -d | gunzip > tweak/Sources/Shared/Flags/SGFlagList.m
          else
            echo "::warning::SG_FLAG_LIST is not set; building with an empty flag table"
            printf 'const SGFlagDef SGFlagTable[] = { { NULL, SGFlagUnknown, 0, 0, 0 } };\nconst NSUInteger SGFlagCount = 0;\n' > tweak/Sources/Shared/Flags/SGFlagList.m
          fi

      - name: Build
        run: env -u MAKELEVEL gmake -C tweak clean package

      - name: Upload the deb
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            tweak/packages/*.deb
            packages/*.deb
          if-no-files-found: error
